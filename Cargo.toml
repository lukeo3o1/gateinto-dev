[package]
name = "gateinto"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Local HTTP CONNECT proxy that relays through a remote HTTPS forward proxy over mutual TLS"
license = "MIT OR Apache-2.0"
readme = "README.md"
publish = false

[dependencies]
aws-lc-rs = { version = "1.18.2", default-features = false, features = ["aws-lc-sys"] }
clap = { version = "4.6.7", features = ["derive"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs"] }
toml = { version = "1.1.8", default-features = false, features = ["std", "serde", "parse"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "env-filter"] }
webpki-roots = "1.0.9"

[target.'cfg(windows)'.dependencies]
rustls-cng = { version = "0.7.1", default-features = false }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Registry", "Win32_System_TpmBaseServices"] }

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }

[[example]]
name = "test_upstream"
test = true
