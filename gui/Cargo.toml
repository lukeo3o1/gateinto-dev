[package]
name = "gateinto-gui"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Prototype of the Gateinto sessions window"
license = "MIT OR Apache-2.0"
publish = false
build = "build.rs"

[[bin]]
name = "gateinto-gui"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Graphics_GdiPlus", "Win32_System_LibraryLoader", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
