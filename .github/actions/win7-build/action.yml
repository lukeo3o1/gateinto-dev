name: Build gateinto for a Windows 7 target
description: Builds gateinto.exe for a -win7-windows-msvc target with a pinned nightly and build-std.

inputs:
  target:
    description: A -win7-windows-msvc target, such as i686-win7-windows-msvc
    required: true
  nasm-version:
    description: NASM version for i686 targets
    required: true
  cache-save:
    description: Whether rust-cache saves the cache
    default: 'false'
  toolchain:
    description: Nightly toolchain with rust-src
    default: nightly-2026-09-15

outputs:
  exe:
    description: Path of the built gateinto.exe
    value: target/${{ inputs.target }}/release/gateinto.exe

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ inputs.toolchain }}
        components: rust-src
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: win7-nightly-${{ inputs.target }}
        save-if: ${{ inputs.cache-save }}
    - name: Install NASM ${{ inputs.nasm-version }}
      if: ${{ startsWith(inputs.target, 'i686-') }}
      uses: ilammy/setup-nasm@v1
      with:
        version: ${{ inputs.nasm-version }}
    - shell: pwsh
      env:
        NIGHTLY_TOOLCHAIN: ${{ inputs.toolchain }}
      run: rustc +$env:NIGHTLY_TOOLCHAIN -vV
    - name: Build
      shell: pwsh
      env:
        NIGHTLY_TOOLCHAIN: ${{ inputs.toolchain }}
        WIN7_TARGET: ${{ inputs.target }}
        AWS_LC_SYS_CMAKE_BUILDER: '0'
      run: cargo +$env:NIGHTLY_TOOLCHAIN build -Z build-std=std,panic_abort --target $env:WIN7_TARGET --locked --release --bin gateinto
