name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: check-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --all-targets --all-features --locked
      - name: Check that gateinto.exe links the C runtime statically
        if: runner.os == 'Windows'
        shell: pwsh
        run: .github/scripts/assert-static-crt.ps1 -Path target\debug\gateinto.exe

  build-windows-release:
    name: release build (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-release
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo build --release --locked
      - run: cargo build --release --locked --example test_upstream
      - name: Check that gateinto.exe links the C runtime statically
        run: .github/scripts/assert-static-crt.ps1 -Path target\release\gateinto.exe
      - uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: |
            target/release/gateinto.exe
            target/release/examples/test_upstream.exe
          if-no-files-found: error
          retention-days: 1

  quickstart:
    name: quickstart (windows-latest)
    needs: build-windows-release
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      UPSTREAM_PORT: '18443'
      KEY_NAME: gateinto-device-v1
    steps:
      - uses: actions/checkout@v7
      - name: Download the binaries that build-windows-release built with the quickstart's cargo build --release --locked
        uses: actions/download-artifact@v8
        with:
          name: windows-release
          path: target/release
      - run: .\target\release\gateinto.exe --version
      - name: Add gateinto to PATH
        run: Join-Path $PWD 'target\release' >> $env:GITHUB_PATH
      - name: gateinto key init
        run: |
          gateinto key init > key-init.out 2> key-init.err
          $code = $LASTEXITCODE
          $out = Get-Content -Raw key-init.out
          $err = Get-Content -Raw key-init.err
          "--- stdout ---`n$out--- stderr ---`n$err"
          if ($code -ne 0) { throw "gateinto key init exited with $code" }
          if ($out -match '(?m)^backend: tpm\r?$') {
            "::notice::This runner has a usable TPM; key init created a TPM key, so the software fallback was not exercised."
          } else {
            if ($out -notmatch "(?m)^created software device key `"$env:KEY_NAME`" because the TPM could not be used\r?$") {
              throw "key init did not report a software key created after the TPM fallback"
            }
            if ($out -notmatch '(?m)^backend: software\r?$') { throw "key init did not report backend: software" }
            if ($err -notmatch '(?m)^warning: ') { throw "key init did not explain the TPM fallback on stderr" }
          }
      - name: gateinto key info
        run: |
          $init = Get-Content -Raw key-init.out
          $out = gateinto key info | Out-String
          if ($LASTEXITCODE -ne 0) { throw "gateinto key info exited with $LASTEXITCODE" }
          $out
          if ($init -match '(?m)^backend: (tpm|software)\r?$') { $backend = $Matches[1] } else { throw "key init output has no backend line" }
          if ($out -notmatch "(?m)^backend: $backend\r?$") { throw "key info did not report backend: $backend" }
          if ($init -match '(?m)^spki-sha256: ([0-9a-f]{64})\r?$') { $fingerprint = $Matches[1] } else { throw "key init output has no spki-sha256 line" }
          if ($out -notmatch "(?m)^spki-sha256: $fingerprint\r?$") { throw "key info did not report the fingerprint from key init ($fingerprint)" }
          if ($out -notmatch '(?m)^client-certificate: none\r?$') { throw "key info did not report client-certificate: none" }
      - name: Tunnel through the local test upstream
        run: |
          function Wait-Port([int] $Port, $Process, [string] $Name) {
            $deadline = (Get-Date).AddSeconds(60)
            while ((Get-Date) -lt $deadline) {
              if ($Process.HasExited) { throw "$Name exited with $($Process.ExitCode) before listening on port $Port" }
              $client = [System.Net.Sockets.TcpClient]::new()
              try {
                $client.Connect('127.0.0.1', $Port)
                return
              } catch {
                Start-Sleep -Milliseconds 250
              } finally {
                $client.Dispose()
              }
            }
            throw "$Name did not listen on port $Port within 60 seconds"
          }

          function Invoke-Curl([string] $Url) {
            $status = curl.exe -sS -o NUL -w "%{http_code}" -x http://127.0.0.1:18736 $Url
            if ($LASTEXITCODE -ne 0) { throw "curl.exe $Url through the proxy exited with $LASTEXITCODE" }
            $status
          }

          $work = Join-Path $env:RUNNER_TEMP 'quickstart'
          New-Item -ItemType Directory -Path $work | Out-Null
          $config = Join-Path $work 'gateinto.toml'
          $logs = @{}
          foreach ($name in 'upstream', 'proxy') {
            $logs[$name] = @((Join-Path $work "$name.out"), (Join-Path $work "$name.err"))
          }
          $processes = @()
          try {
            $upstream = Start-Process -FilePath (Resolve-Path 'target\release\examples\test_upstream.exe').Path -PassThru -NoNewWindow `
              -ArgumentList '--port', $env:UPSTREAM_PORT, '--ca-out', "`"$(Join-Path $work 'upstream-ca.pem')`"" `
              -RedirectStandardOutput $logs.upstream[0] -RedirectStandardError $logs.upstream[1]
            $null = $upstream.Handle
            $processes += $upstream
            Wait-Port $env:UPSTREAM_PORT $upstream 'test upstream'

            $text = Get-Content -Raw config.example.toml
            $replacements = [ordered]@{
              '(?m)^host = "proxy\.example\.invalid"' = 'host = "127.0.0.1"'
              '(?m)^port = 443' = "port = $env:UPSTREAM_PORT"
              '(?m)^# server_name = "proxy\.example\.invalid"' = 'server_name = "localhost"'
              '(?m)^# ca_file = "upstream-ca\.pem"' = 'ca_file = "upstream-ca.pem"'
            }
            foreach ($pattern in $replacements.Keys) {
              $found = [regex]::Matches($text, $pattern).Count
              if ($found -ne 1) { throw "config.example.toml has $found matches for $pattern, expected 1" }
              $text = [regex]::Replace($text, $pattern, $replacements[$pattern])
            }
            [System.IO.File]::WriteAllText($config, $text)
            Get-Content $config

            $check = gateinto check-upstream --config $config --target example.com:443 | Out-String
            $code = $LASTEXITCODE
            $check
            if ($code -ne 0) { throw "gateinto check-upstream exited with $code" }
            foreach ($line in 'tls-version: TLSv1_3', 'key-exchange-group: X25519MLKEM768', 'connect-status: HTTP/1.1 200 Connection established') {
              if ($check -notmatch "(?m)^$([regex]::Escape($line))\r?$") { throw "check-upstream did not print '$line'" }
            }

            $proxy = Start-Process -FilePath (Get-Command gateinto).Source -PassThru -NoNewWindow `
              -ArgumentList 'proxy', '--config', "`"$config`"" `
              -RedirectStandardOutput $logs.proxy[0] -RedirectStandardError $logs.proxy[1]
            $null = $proxy.Handle
            $processes += $proxy
            Wait-Port 18736 $proxy 'gateinto proxy'

            $status = Invoke-Curl 'https://example.com/'
            if ($status -ne '200') { throw "HTTPS through the proxy returned $status, expected 200" }
            "HTTPS through the proxy: $status"
            $status = Invoke-Curl 'http://example.com/'
            if ($status -ne '405') { throw "plain HTTP through the proxy returned $status, expected 405" }
            "plain HTTP through the proxy: $status"
          } finally {
            foreach ($process in $processes) {
              if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
              $process.WaitForExit()
            }
            foreach ($name in $logs.Keys) {
              foreach ($file in $logs[$name]) {
                if (Test-Path $file) { "--- $file ---"; Get-Content $file }
              }
            }
          }
      - name: Delete the device key
        if: always()
        run: |
          if (-not (Get-Command gateinto -ErrorAction SilentlyContinue)) { "gateinto was not downloaded; no device key to delete"; exit 0 }
          gateinto key info > key-delete.out 2>&1
          if ($LASTEXITCODE -ne 0) { "No device key to delete"; exit 0 }
          $provider = if (Select-String -Quiet -Pattern '^backend: tpm' key-delete.out) { 'Microsoft Platform Crypto Provider' } else { 'Microsoft Software Key Storage Provider' }
          certutil -csp $provider -delkey -user $env:KEY_NAME
          if ($LASTEXITCODE -ne 0) { "::warning::certutil could not delete device key $env:KEY_NAME from $provider" }
          exit 0

  msi:
    name: msi install, uninstall and purge (windows-latest, Software KSP)
    needs: build-windows-release
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      WIX_VERSION: '5.0.2'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: windows-release
          path: target/release
      - name: Install WiX ${{ env.WIX_VERSION }}
        run: |
          dotnet tool install --global wix --version $env:WIX_VERSION
          if ($LASTEXITCODE -ne 0) { throw "dotnet tool install wix exited with $LASTEXITCODE" }
          Join-Path $env:USERPROFILE '.dotnet\tools' >> $env:GITHUB_PATH
      - name: Build the MSI
        run: |
          pwsh packaging/wix/build.ps1 -Output "$env:RUNNER_TEMP\gateinto.msi"
          if ($LASTEXITCODE -ne 0) { throw "build.ps1 exited with $LASTEXITCODE" }
          Copy-Item target\release\gateinto.exe "$env:RUNNER_TEMP\gateinto-outside.exe"
          "MSI=$env:RUNNER_TEMP\gateinto.msi" >> $env:GITHUB_ENV
          "OUTSIDE=$env:RUNNER_TEMP\gateinto-outside.exe" >> $env:GITHUB_ENV
          "INSTALL_DIR=$env:LOCALAPPDATA\Programs\Gateinto" >> $env:GITHUB_ENV
          "INSTALLED=$env:LOCALAPPDATA\Programs\Gateinto\gateinto.exe" >> $env:GITHUB_ENV
      - name: Install silently per user
        run: |
          $log = "$env:RUNNER_TEMP\install-1.log"
          $process = Start-Process msiexec.exe -Wait -PassThru -ArgumentList '/i', "`"$env:MSI`"", '/qn', '/norestart', '/l*v', "`"$log`""
          if ($process.ExitCode -ne 0) { Get-Content $log -Tail 200; throw "msiexec /i exited with $($process.ExitCode) (3010 means a restart was needed)" }
      - name: Check the exe, PATH, the gateinto:// handler, the uninstall entry, and that no key was created
        run: |
          if (-not (Test-Path $env:INSTALLED)) { throw "$env:INSTALLED is missing" }
          $userPath = (Get-ItemProperty 'HKCU:\Environment').Path
          "user PATH: $userPath"
          if (-not ($userPath -split ';' | Where-Object { $_.TrimEnd('\') -eq $env:INSTALL_DIR })) { throw "the user PATH does not contain $env:INSTALL_DIR" }
          $command = (Get-ItemProperty 'HKCU:\Software\Classes\gateinto\shell\open\command').'(default)'
          $expected = "`"$env:INSTALLED`" open -- `"%1`""
          "handler: $command"
          if ($command -ne $expected) { throw "the handler command is '$command', expected '$expected'" }
          $scheme = Get-ItemProperty 'HKCU:\Software\Classes\gateinto'
          if ($null -eq $scheme.'URL Protocol') { throw 'HKCU\Software\Classes\gateinto has no URL Protocol value' }
          if ($null -ne (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name Gateinto -ErrorAction SilentlyContinue)) {
            throw 'the autostart entry exists although AUTOSTART was not set'
          }
          $uninstall = Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall', 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall', 'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall' -ErrorAction SilentlyContinue |
            Get-ItemProperty | Where-Object { $_.PSObject.Properties['DisplayName'] -and $_.DisplayName -eq 'Gateinto' }
          if (-not $uninstall) { throw 'no uninstall entry with DisplayName Gateinto' }
          $uninstall | Select-Object PSPath, DisplayName, DisplayVersion, UninstallString | Format-List
          $stderrFile = "$env:RUNNER_TEMP\key-info-before-setup.err"
          & $env:INSTALLED key info 2> $stderrFile
          $code = $LASTEXITCODE
          $keyInfoError = Get-Content -Raw $stderrFile
          "key info stderr: $keyInfoError"
          if ($code -eq 0) { throw 'a device key exists right after installing; the installer must not create one' }
          if ($keyInfoError -notmatch 'no device key named') { throw 'key info failed for another reason than a missing device key' }
          exit 0
      - name: gateinto setup (Microsoft Software Key Storage Provider, not a TPM)
        run: |
          $out = & $env:INSTALLED setup --backend software | Out-String
          if ($LASTEXITCODE -ne 0) { throw "gateinto setup exited with $LASTEXITCODE" }
          $out
          if ($out -notmatch '(?m)^device-key: created\r?$') { throw 'the first setup did not create the key' }
          if ($out -notmatch '(?m)^provider: Microsoft Software Key Storage Provider\r?$') { throw 'setup did not use the Software KSP' }
          $handler = [regex]::Escape("`"$env:INSTALLED`" open -- `"%1`"")
          if ($out -notmatch "(?m)^uri-handler: gateinto: $handler\r?$") { throw 'setup did not report the installed handler' }
          if ($out -match '(?m)^spki-sha256: ([0-9a-f]{64})\r?$') { $spki = $Matches[1] } else { throw 'setup printed no spki-sha256' }
          "SPKI=$spki" >> $env:GITHUB_ENV
          $status = & $env:INSTALLED status | Out-String
          if ($LASTEXITCODE -ne 0) { throw "gateinto status exited with $LASTEXITCODE" }
          $status
          if ($status -notmatch "(?m)^spki-sha256: $spki\r?$") { throw 'status did not report the key from setup' }
      - name: Uninstall while the agent runs, then check what is removed and what is kept
        run: |
          $agent = Start-Process $env:INSTALLED -ArgumentList 'agent' -PassThru -WindowStyle Hidden
          $deadline = (Get-Date).AddSeconds(30)
          while ((& $env:INSTALLED status | Out-String) -notmatch '(?m)^agent: running\r?$') {
            if ((Get-Date) -gt $deadline) { throw 'the agent did not start within 30 seconds' }
            Start-Sleep -Milliseconds 250
          }
          $log = "$env:RUNNER_TEMP\uninstall-1.log"
          $process = Start-Process msiexec.exe -Wait -PassThru -ArgumentList '/x', "`"$env:MSI`"", '/qn', '/norestart', '/l*v', "`"$log`""
          if ($process.ExitCode -ne 0) { Get-Content $log -Tail 200; throw "msiexec /x exited with $($process.ExitCode) (3010 means a restart was needed)" }
          if (-not (Select-String -Path $log -SimpleMatch -Quiet 'Doing action: StopAgent')) { throw 'the uninstall log has no StopAgent action' }
          if (-not $agent.WaitForExit(30000)) { Stop-Process -Id $agent.Id -Force; throw 'the uninstaller did not stop the agent' }
          if (Test-Path $env:INSTALLED) { throw "$env:INSTALLED still exists after uninstall" }
          if (Test-Path 'HKCU:\Software\Classes\gateinto') { throw 'the gateinto:// handler still exists after uninstall' }
          $userPath = (Get-ItemProperty 'HKCU:\Environment' -ErrorAction SilentlyContinue).Path
          if ($userPath -split ';' | Where-Object { $_.TrimEnd('\') -eq $env:INSTALL_DIR }) { throw "the user PATH still contains $env:INSTALL_DIR" }
          $out = & $env:OUTSIDE key info | Out-String
          if ($LASTEXITCODE -ne 0) { throw "gateinto key info exited with $LASTEXITCODE after uninstall" }
          $out
          if ($out -notmatch "(?m)^spki-sha256: $env:SPKI\r?$") { throw 'the device key changed or vanished after uninstall' }
      - name: Reinstall with AUTOSTART=1 and set up again (Software KSP)
        run: |
          $log = "$env:RUNNER_TEMP\install-2.log"
          $process = Start-Process msiexec.exe -Wait -PassThru -ArgumentList '/i', "`"$env:MSI`"", '/qn', '/norestart', 'AUTOSTART=1', '/l*v', "`"$log`""
          if ($process.ExitCode -ne 0) { Get-Content $log -Tail 200; throw "msiexec /i exited with $($process.ExitCode) (3010 means a restart was needed)" }
          $run = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name Gateinto -ErrorAction SilentlyContinue).Gateinto
          $expected = "`"$env:INSTALLED`" agent --detach"
          "autostart: $run"
          if ($run -ne $expected) { throw "the autostart entry is '$run', expected '$expected'" }
          $out = & $env:INSTALLED setup --backend software | Out-String
          if ($LASTEXITCODE -ne 0) { throw "gateinto setup exited with $LASTEXITCODE" }
          $out
          if ($out -notmatch '(?m)^device-key: reused\r?$') { throw 'setup after reinstall did not reuse the key' }
          if ($out -notmatch "(?m)^spki-sha256: $env:SPKI\r?$") { throw 'setup after reinstall reported another SPKI' }
      - name: Purge the device identity, then setup creates a new one (Software KSP)
        run: |
          $prefix = $env:SPKI.Substring(0, 16)
          $wrong = if ($prefix.StartsWith('0')) { '1' * 16 } else { '0' * 16 }
          & $env:INSTALLED reset --purge-device-identity --confirm-spki $wrong
          if ($LASTEXITCODE -eq 0) { throw 'reset accepted a wrong SPKI prefix' }
          '' | & $env:INSTALLED reset --purge-device-identity
          if ($LASTEXITCODE -eq 0) { throw 'reset without a terminal or --confirm-spki succeeded' }
          $out = & $env:INSTALLED key info | Out-String
          if ($out -notmatch "(?m)^spki-sha256: $env:SPKI\r?$") { throw 'a refused reset changed the key' }

          $out = & $env:INSTALLED reset --purge-device-identity --confirm-spki $prefix | Out-String
          if ($LASTEXITCODE -ne 0) { throw "gateinto reset exited with $LASTEXITCODE" }
          $out
          & $env:INSTALLED key info
          if ($LASTEXITCODE -eq 0) { throw 'the device key still exists after reset' }
          $status = & $env:INSTALLED status | Out-String
          $status
          if ($status -notmatch '(?m)^device-key: absent') { throw 'status did not report the key as absent' }
          if ($status -notmatch '(?m)^uri-handler: gateinto: ') { throw 'reset removed the gateinto:// handler' }

          $out = & $env:INSTALLED setup --backend software | Out-String
          if ($LASTEXITCODE -ne 0) { throw "gateinto setup exited with $LASTEXITCODE" }
          $out
          if ($out -notmatch '(?m)^device-key: created\r?$') { throw 'setup after reset did not create a key' }
          if ($out -match '(?m)^spki-sha256: ([0-9a-f]{64})\r?$') { $spki = $Matches[1] } else { throw 'setup printed no spki-sha256' }
          if ($spki -eq $env:SPKI) { throw 'setup after reset reported the purged SPKI' }
          "SPKI=$spki" >> $env:GITHUB_ENV
      - name: Uninstall the AUTOSTART install and check that the autostart entry is gone
        run: |
          $log = "$env:RUNNER_TEMP\uninstall-2.log"
          $process = Start-Process msiexec.exe -Wait -PassThru -ArgumentList '/x', "`"$env:MSI`"", '/qn', '/norestart', '/l*v', "`"$log`""
          if ($process.ExitCode -ne 0) { Get-Content $log -Tail 200; throw "msiexec /x exited with $($process.ExitCode) (3010 means a restart was needed)" }
          if ($null -ne (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name Gateinto -ErrorAction SilentlyContinue)) {
            throw 'the autostart entry still exists after uninstall'
          }
          if (Test-Path $env:INSTALLED) { throw "$env:INSTALLED still exists after uninstall" }
      - name: Clean up the key and the installation
        if: always()
        run: |
          if ($env:SPKI -and (Test-Path $env:OUTSIDE)) {
            & $env:OUTSIDE reset --purge-device-identity --confirm-spki $env:SPKI
          }
          if ($env:MSI -and (Test-Path $env:MSI)) {
            Start-Process msiexec.exe -Wait -ArgumentList '/x', "`"$env:MSI`"", '/qn', '/norestart'
          }
          exit 0
      - name: Upload the installer logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: msi-logs
          path: ${{ runner.temp }}/*.log
          if-no-files-found: ignore
