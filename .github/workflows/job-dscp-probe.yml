name: Job DSCP probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - experiments/job-dscp/**
      - .github/workflows/job-dscp-probe.yml

permissions:
  contents: read

concurrency:
  group: job-dscp-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m unittest discover -s experiments/job-dscp -p 'test_*.py' -v
      - name: Test portable probe helpers
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror experiments/job-dscp/probe.cpp -o /tmp/job-dscp-probe-test
          /tmp/job-dscp-probe-test

  windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - name: Build probe with official signed driver
        run: experiments/job-dscp/build.ps1
      - name: Measure job DSCP visibility at the WinDivert network layer
        run: experiments/job-dscp/ci.ps1
      - name: Upload aggregate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: job-dscp-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/job-dscp-results/aggregate-evidence.json
            ${{ runner.temp }}/job-dscp-results/ci-summary.json
            ${{ runner.temp }}/job-dscp-results/environment.json
            ${{ runner.temp }}/job-dscp-bin/driver-manifest.json
          if-no-files-found: warn
          retention-days: 14
