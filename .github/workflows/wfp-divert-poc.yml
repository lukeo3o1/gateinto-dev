name: WFP and WinDivert PoC

on:
  workflow_dispatch:
  pull_request:
    paths:
      - experiments/wfp-divert/**
      - examples/wfp_lab.rs
      - .github/workflows/wfp-divert-poc.yml

permissions:
  contents: read

concurrency:
  group: wfp-divert-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m unittest discover -s experiments/wfp-divert -p 'test_*.py' -v
      - name: Test native parsing and packet decision helpers
        run: |
          g++ -std=c++17 experiments/wfp-divert/native-events.cpp -o /tmp/native-events-test
          /tmp/native-events-test
          g++ -std=c++17 -DWFP_PACKET_STATE_TEST experiments/wfp-divert/packets.cpp -o /tmp/packet-state-test
          /tmp/packet-state-test

  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: windows-release
          save-if: false
      - name: Build controlled gateway, Gateinto and echo fixture
        run: cargo build --release --locked --example wfp_lab
      - name: Build native probes with official signed driver
        run: experiments/wfp-divert/build.ps1
      - name: Run first-packet hold and TCP redirect experiments
        run: experiments/wfp-divert/ci.ps1
      - name: Upload evidence even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wfp-divert-windows-2022-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/wfp-divert-results/**
            !${{ runner.temp }}/wfp-divert-results/**/private-manifest.json
            ${{ runner.temp }}/wfp-divert-bin/driver-manifest.json
          if-no-files-found: warn
          retention-days: 14
