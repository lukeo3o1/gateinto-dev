name: WFP and WinDivert PoC

on:
  workflow_dispatch:
  pull_request:
    paths:
      - experiments/wfp-divert/**
      - examples/wfp_lab.rs
      - .github/workflows/wfp-divert-poc.yml

permissions:
  contents: read

concurrency:
  group: wfp-divert-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m unittest discover -s experiments/wfp-divert -p 'test_*.py' -v
      - name: Test native parsing and packet decision helpers
        run: |
          g++ -std=c++17 experiments/wfp-divert/native-events.cpp -o /tmp/native-events-test
          /tmp/native-events-test
          g++ -std=c++17 -Wall -Wextra experiments/wfp-divert/ale-endpoints.cpp -o /tmp/ale-endpoints-test
          /tmp/ale-endpoints-test
          g++ -std=c++17 -DWFP_PACKET_STATE_TEST experiments/wfp-divert/packets.cpp -o /tmp/packet-state-test
          /tmp/packet-state-test
          g++ -std=c++17 -Wall -Wextra experiments/wfp-divert/inproc.cpp -o /tmp/inproc-test
          /tmp/inproc-test
          g++ -std=c++17 -Wall -Wextra -DWFP_CLIENT_STATE_TEST experiments/wfp-divert/client.cpp -o /tmp/client-state-test
          /tmp/client-state-test
          g++ -std=c++17 -Wall -Wextra -Werror experiments/wfp-divert/socket-events.cpp -o /tmp/socket-events-test
          /tmp/socket-events-test

  windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: windows-release
          save-if: false
      - name: Build controlled gateway, Gateinto and echo fixture
        run: cargo build --release --locked --example wfp_lab
      - name: Build native probes with official signed driver
        run: experiments/wfp-divert/build.ps1
      - name: Run first-packet hold and TCP redirect experiments
        run: experiments/wfp-divert/ci.ps1
      - name: Upload evidence even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wfp-divert-${{ matrix.os }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/wfp-divert-results/aggregate-evidence.json
            ${{ runner.temp }}/wfp-divert-results/ci-summary.json
            ${{ runner.temp }}/wfp-divert-results/environment.json
            ${{ runner.temp }}/wfp-divert-bin/driver-manifest.json
          if-no-files-found: warn
          retention-days: 14

  socket-observation:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: windows-release
          save-if: false
      - run: cargo build --release --locked --example wfp_lab
      - run: experiments/wfp-divert/build.ps1
      - run: experiments/wfp-divert/socket-ci.ps1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wfp-socket-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/wfp-socket-results/aggregate-evidence.json
            ${{ runner.temp }}/wfp-socket-results/ci-summary.json
            ${{ runner.temp }}/wfp-socket-results/environment.json
            ${{ runner.temp }}/wfp-divert-bin/driver-manifest.json
          if-no-files-found: warn
          retention-days: 14

  socket-routing:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: windows-release
          save-if: false
      - run: cargo build --release --locked --example wfp_lab
      - run: experiments/wfp-divert/build.ps1
      - run: experiments/wfp-divert/socket-routing-ci.ps1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wfp-socket-routing-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/wfp-socket-routing-results/aggregate-evidence.json
            ${{ runner.temp }}/wfp-socket-routing-results/ci-summary.json
            ${{ runner.temp }}/wfp-socket-routing-results/environment.json
            ${{ runner.temp }}/wfp-divert-bin/driver-manifest.json
          if-no-files-found: warn
          retention-days: 14

  native-control:
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - run: experiments/wfp-divert/build.ps1
      - run: experiments/wfp-divert/drop-control.ps1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wfp-native-control-${{ github.run_id }}
          path: ${{ runner.temp }}/wfp-native-control/summary.json
          if-no-files-found: warn
          retention-days: 14
