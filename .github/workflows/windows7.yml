name: Windows 7 feasibility

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/windows7.yml
      - .github/actions/win7-build/**
      - .github/actions/win7-audit/**
      - .github/scripts/assert-static-crt.ps1
      - .github/scripts/assert-win7-imports.ps1
      - .github/scripts/win7-imports.txt
      - .github/scripts/win7-gui-imports.txt
      - .cargo/config.toml
      - Cargo.toml
      - Cargo.lock
      - src/**
      - ipc-types/**
      - gui/**
      - docs/windows7-feasibility.md

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  NASM_VERSION: '2.16.03'

jobs:
  build:
    name: ${{ matrix.target }}, ${{ matrix.bin }}
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [i686-win7-windows-msvc]
        bin: [gateinto, gateinto-gui]
        include:
          - bin: gateinto
            package: gateinto
            imports: imports.txt
            extra-allow-list: ''
          - bin: gateinto-gui
            package: gateinto-gui
            imports: gui-imports.txt
            extra-allow-list: .github/scripts/win7-gui-imports.txt
    steps:
      - uses: actions/checkout@v7
      - name: Build
        id: build
        uses: ./.github/actions/win7-build
        with:
          target: ${{ matrix.target }}
          package: ${{ matrix.package }}
          bin: ${{ matrix.bin }}
          nasm-version: ${{ env.NASM_VERSION }}
          cache-save: ${{ github.event_name == 'workflow_dispatch' }}
      - uses: ./.github/actions/win7-audit
        with:
          target: ${{ matrix.target }}
          bin: ${{ matrix.bin }}
          imports: ${{ matrix.imports }}
          extra-allow-list: ${{ matrix.extra-allow-list }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          name: ${{ matrix.bin }}-${{ matrix.target }}
          path: |
            ${{ steps.build.outputs.exe }}
            ${{ matrix.imports }}
          if-no-files-found: error
