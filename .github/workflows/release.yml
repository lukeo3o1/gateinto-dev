name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RELEASE_TARGET: x86_64-pc-windows-msvc
  WIX_VERSION: '5.0.2'

jobs:
  build:
    name: Build x86_64-pc-windows-msvc
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    outputs:
      package: ${{ steps.package.outputs.package }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.RELEASE_TARGET }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: check-windows-latest
          save-if: false
      - run: cargo test --all-targets --all-features --locked
      - run: cargo build --locked --release --target $env:RELEASE_TARGET --bin gateinto
      - name: Check that gateinto.exe links the C runtime statically
        run: .github/scripts/assert-static-crt.ps1 -Path "target\$env:RELEASE_TARGET\release\gateinto.exe"
      - name: Package
        id: package
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          $version = if ($env:REF_TYPE -eq 'tag') { $env:REF_NAME } else { $env:COMMIT.Substring(0, 12) }
          $package = "gateinto-$version-$env:RELEASE_TARGET"
          $stage = Join-Path 'stage' $package
          New-Item -ItemType Directory -Path $stage, 'dist' | Out-Null
          Copy-Item "target\$env:RELEASE_TARGET\release\gateinto.exe", LICENSE-MIT, LICENSE-APACHE, README.md, SECURITY.md -Destination $stage
          $zip = "$package.zip"
          Compress-Archive -Path $stage -DestinationPath (Join-Path 'dist' $zip)
          $hash = (Get-FileHash -Algorithm SHA256 (Join-Path 'dist' $zip)).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText((Join-Path 'dist' "$zip.sha256"), "$hash  $zip`n")
          Get-ChildItem dist
          Get-Content (Join-Path 'dist' "$zip.sha256")
          "package=$package" >> $env:GITHUB_OUTPUT
      - name: Install WiX ${{ env.WIX_VERSION }}
        run: |
          dotnet tool install --global wix --version $env:WIX_VERSION
          if ($LASTEXITCODE -ne 0) { throw "dotnet tool install wix exited with $LASTEXITCODE" }
          Join-Path $env:USERPROFILE '.dotnet\tools' >> $env:GITHUB_PATH
      - name: Build the MSI
        env:
          PACKAGE: ${{ steps.package.outputs.package }}
        run: |
          $msi = "$env:PACKAGE.msi"
          pwsh packaging/wix/build.ps1 -Binary "target\$env:RELEASE_TARGET\release\gateinto.exe" -Output (Join-Path $PWD "dist\$msi")
          if ($LASTEXITCODE -ne 0) { throw "build.ps1 exited with $LASTEXITCODE" }
          $hash = (Get-FileHash -Algorithm SHA256 (Join-Path 'dist' $msi)).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText((Join-Path 'dist' "$msi.sha256"), "$hash  $msi`n")
          Get-ChildItem dist
          Get-Content (Join-Path 'dist' "$msi.sha256")
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.package }}
          path: dist/
          if-no-files-found: error

  release:
    name: Draft GitHub release
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download package
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ needs.build.outputs.package }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$PACKAGE" --dir dist
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l dist
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$TAG" --generate-notes
