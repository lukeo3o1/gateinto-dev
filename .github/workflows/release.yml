name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      channel:
        description: Release to replace
        type: choice
        options: [beta, latest]
        required: true
      ref:
        description: Branch, tag or full commit SHA to build
        default: master
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.channel || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success') && 'alpha' || format('skipped-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  WIX_VERSION: '5.0.2'
  NASM_VERSION: '2.16.03'
  RELEASE_VERSION: '0.0.0'

jobs:
  resolve:
    name: Resolve the commit
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      channel: ${{ steps.resolve.outputs.channel }}
      sha: ${{ steps.resolve.outputs.sha }}
      short: ${{ steps.resolve.outputs.short }}
      built: ${{ steps.resolve.outputs.built }}
      version: ${{ steps.resolve.outputs.version }}
      stale: ${{ steps.resolve.outputs.stale }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.workflow_run.head_sha }}
      - id: resolve
        shell: bash
        env:
          CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'alpha' }}
        run: |
          sha=$(git rev-parse HEAD)
          stale=false
          if [[ $CHANNEL == alpha ]]; then
            tip=$(git ls-remote --exit-code origin refs/heads/master | cut -f 1)
            if [[ $tip != "$sha" ]]; then
              stale=true
              echo "::notice::Not publishing alpha: $sha is no longer the tip of master ($tip). The run for the newer commit publishes alpha if its CI passes."
            fi
          fi
          {
            echo "stale=$stale"
            echo "channel=$CHANNEL"
            echo "sha=$sha"
            echo "short=${sha:0:12}"
            echo "version=$RELEASE_VERSION-${sha:0:12}"
            echo "built=$(date -u '+%Y-%m-%d %H:%M UTC')"
          } | tee -a "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: resolve
    if: needs.resolve.outputs.stale == 'false'
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            cache-key: check-windows-latest
            test-args: ''
            msi-arch: x64
          - target: i686-pc-windows-msvc
            cache-key: windows-i686
            test-args: --target i686-pc-windows-msvc
            msi-arch: x86
            nasm: true
    env:
      RELEASE_TARGET: ${{ matrix.target }}
      SHORT_SHA: ${{ needs.resolve.outputs.short }}
      GATEINTO_BUILD_VERSION: ${{ needs.resolve.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.RELEASE_TARGET }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.cache-key }}
          save-if: false
      - name: Install NASM ${{ env.NASM_VERSION }}
        if: matrix.nasm
        uses: ilammy/setup-nasm@v1
        with:
          version: ${{ env.NASM_VERSION }}
      - run: cargo test ${{ matrix.test-args }} --all-targets --all-features --locked
      - run: cargo build --locked --release --target $env:RELEASE_TARGET --bin gateinto
      - name: Check that gateinto.exe links the C runtime statically
        run: .github/scripts/assert-static-crt.ps1 -Path "target\$env:RELEASE_TARGET\release\gateinto.exe"
      - name: Check that gateinto.exe prints the build version
        run: .github/scripts/assert-version.ps1 -Path "target\$env:RELEASE_TARGET\release\gateinto.exe" -Version $env:GATEINTO_BUILD_VERSION
      - name: Stage gateinto.exe
        run: |
          $exe = Join-Path 'dist' "gateinto-$env:SHORT_SHA-$env:RELEASE_TARGET.exe"
          New-Item -ItemType Directory -Path 'dist' | Out-Null
          Copy-Item "target\$env:RELEASE_TARGET\release\gateinto.exe" -Destination $exe
          .github/scripts/write-sha256.ps1 -Path $exe
      - name: Install WiX ${{ env.WIX_VERSION }}
        run: |
          dotnet tool install --global wix --version $env:WIX_VERSION
          if ($LASTEXITCODE -ne 0) { throw "dotnet tool install wix exited with $LASTEXITCODE" }
          Join-Path $env:USERPROFILE '.dotnet\tools' >> $env:GITHUB_PATH
      - name: Build the ${{ matrix.msi-arch }} MSI
        env:
          MSI_ARCH: ${{ matrix.msi-arch }}
        run: |
          $msi = Join-Path $PWD "dist\gateinto-$env:SHORT_SHA-$env:RELEASE_TARGET.msi"
          pwsh packaging/wix/build.ps1 -Binary "target\$env:RELEASE_TARGET\release\gateinto.exe" -Output $msi `
            -Arch $env:MSI_ARCH -Version $env:RELEASE_VERSION -DisplayVersion $env:GATEINTO_BUILD_VERSION
          if ($LASTEXITCODE -ne 0) { throw "build.ps1 exited with $LASTEXITCODE" }
          .github/scripts/write-sha256.ps1 -Path $msi
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  win7:
    name: Build ${{ matrix.target }} (experimental)
    needs: resolve
    if: needs.resolve.outputs.stale == 'false' && needs.resolve.outputs.channel != 'latest'
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      matrix:
        target: [x86_64-win7-windows-msvc, i686-win7-windows-msvc]
    env:
      WIN7_TARGET: ${{ matrix.target }}
      SHORT_SHA: ${{ needs.resolve.outputs.short }}
      GATEINTO_BUILD_VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - name: Build
        id: build
        uses: ./.github/actions/win7-build
        with:
          target: ${{ matrix.target }}
          nasm-version: ${{ env.NASM_VERSION }}
      - uses: ./.github/actions/win7-audit
        with:
          target: ${{ matrix.target }}
      - name: Check that gateinto.exe prints the build version
        shell: pwsh
        env:
          EXE: ${{ steps.build.outputs.exe }}
        run: .github/scripts/assert-version.ps1 -Path $env:EXE -Version $env:GATEINTO_BUILD_VERSION
      - name: Stage gateinto.exe
        shell: pwsh
        env:
          EXE: ${{ steps.build.outputs.exe }}
        run: |
          $exe = Join-Path 'dist' "gateinto-$env:SHORT_SHA-$env:WIN7_TARGET-experimental.exe"
          New-Item -ItemType Directory -Path 'dist' | Out-Null
          Copy-Item $env:EXE -Destination $exe
          .github/scripts/write-sha256.ps1 -Path $exe
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish the ${{ needs.resolve.outputs.channel }} release
    needs: [resolve, build, win7]
    if: >-
      !cancelled() && needs.build.result == 'success' &&
      (needs.win7.result == 'success' || (needs.resolve.outputs.channel == 'latest' && needs.win7.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      CHANNEL: ${{ needs.resolve.outputs.channel }}
      SHA: ${{ needs.resolve.outputs.sha }}
      BUILT: ${{ needs.resolve.outputs.built }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Check the files and add copies without the commit in their names
        run: .github/scripts/release-assets.sh "$CHANNEL" "$SHA" dist
      - run: .github/scripts/release-notes.sh "$CHANNEL" "$SHA" "$BUILT" | tee "$RUNNER_TEMP/notes.md"
      - name: Replace the ${{ needs.resolve.outputs.channel }} release and move its tag to the commit
        run: |
          if gh release view "$CHANNEL" > /dev/null 2>&1; then
            gh release delete "$CHANNEL" --cleanup-tag --yes
          fi
          if gh api "repos/$GH_REPO/git/ref/tags/$CHANNEL" > /dev/null 2>&1; then
            gh api --method DELETE "repos/$GH_REPO/git/refs/tags/$CHANNEL"
          fi
          if [[ $CHANNEL == latest ]]; then
            flags=(--latest)
          else
            flags=(--prerelease --latest=false)
          fi
          gh release create "$CHANNEL" dist/* --target "$SHA" --title "Gateinto $CHANNEL $SHA ($BUILT)" \
            --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
          gh release view "$CHANNEL"
